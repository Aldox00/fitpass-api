spring.application.name=fitpass

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitpass_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:fitpass.oficial@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

supabase.url=${SUPABASE_URL:https://zqojacsfpjmiiacvxetk.supabase.co/rest/v1}
supabase.key=${SUPABASE_KEY:}

nominatim.url=https://nominatim.openstreetmap.org
nominatim.user-agent=FitPassGeolocalizacionApp/1.0 (contacto@fitpass.com)

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:MiClaveSuperSecretaDeFitPassParaDesarrolloLocal2026QueTieneMasDe32Bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${PORT:8080}